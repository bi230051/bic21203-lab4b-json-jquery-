
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Information</title>
</head>
<body>

    <h1>Books Information</h1>

    <div id="bookOutput">
        <p>Loading books...</p>
    </div>

    <script>
        async function loadBooks() {
            const output = document.getElementById("bookOutput");

            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Unable to load books data.");
                }

                const data = await response.json();

                output.textContent = "";

                const firstBook = data.books[0];
                const secondBook = data.books[1];

                const title = document.createElement("p");
                title.textContent = "First Book Title: " + firstBook.title;
                output.appendChild(title);

                const author = document.createElement("p");
                author.textContent = "Second Book Author: " + secondBook.author;
                output.appendChild(author);

                const firstGenres = document.createElement("p");
                firstGenres.textContent =
                    firstBook.title + " — " + firstBook.genres.join(", ");
                output.appendChild(firstGenres);

                const secondGenres = document.createElement("p");
                secondGenres.textContent =
                    secondBook.title + " — " + secondBook.genres.join(", ");
                output.appendChild(secondGenres);

            } catch (error) {
                output.textContent =
                    "Error: Unable to load the books data.";
            }
        }

        loadBooks();
    </script>

</body>
</html>
